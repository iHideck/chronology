name: Deploy notify

# GitHub Pages のデプロイの成否を Slack に知らせる（ほかのリポジトリの CD と同じ形）。
# Webhook の URL はシークレット SLACK_WEBHOOK_URL_DEPLOY。置くまでは送らずに飛ばす（失敗にしない）
on:
  deployment_status:

permissions: {}

jobs:
  notify:
    if: github.event.deployment.environment == 'github-pages' && contains(fromJSON('["success", "failure", "error"]'), github.event.deployment_status.state)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}
    steps:
      - name: Slack Notification (Deploy Success)
        if: env.SLACK_WEBHOOK != '' && github.event.deployment_status.state == 'success'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: "good"
          SLACK_MESSAGE: "Env: `prd`\nMsg: chronology の deploy に成功しました:rocket: (`${{ github.event.deployment.sha }}`)"
      - name: Slack Notification (Deploy Failed)
        if: env.SLACK_WEBHOOK != '' && github.event.deployment_status.state != 'success'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: "danger"
          SLACK_MESSAGE: "<!channel>\nEnv: `prd`\nMsg: chronology の deploy に失敗しました:cry: (`${{ github.event.deployment.sha }}`)"
      - name: Webhook の URL がないときは知らせない
        if: env.SLACK_WEBHOOK == ''
        run: echo "SLACK_WEBHOOK_URL_DEPLOY が設定されていないため、通知を送りません"
