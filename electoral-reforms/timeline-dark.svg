<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="tl" viewBox="0 0 760 2062" width="760" height="2062" role="img" aria-labelledby="tl-title">
<title id="tl-title">選挙制度の変更（1945年〜）</title>
<style>
.tl{--paper:#14171f;--ink:#e6e8ee;--ink2:#b2b8c4;--muted:#8d94a3;--rule:#232833;--rule2:#3d4452;--spine-a:#1b1f29;--spine-b:#222733;--red:#e5604a;--blue:#678bd2;--amber:#c98500;--violet:#9085e9;--green:#199e70;--teal:#1f9fa1;--gray:#6b7280;--font-body:"BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, Meiryo, "Noto Sans JP", "Noto Sans CJK JP", sans-serif;--font-display:"Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "BIZ UDPMincho", "Noto Serif JP", "Noto Serif CJK JP", serif}

.tl .bg{fill:var(--paper)}
.tl .spine-a{fill:var(--spine-a)}
.tl .spine-b{fill:var(--spine-b)}
.tl .grid{stroke:var(--rule);stroke-width:1}
.tl .era-line{stroke:var(--rule2);stroke-width:1}
.tl .asof-line{stroke:var(--muted);stroke-width:1}
.tl .tick{stroke:var(--rule2);stroke-width:1;fill:none}
.tl .axis{stroke:var(--rule2);stroke-width:1}
.tl text{font-family:var(--font-body)}
.tl .dec-y{font-size:13px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.tl .dec-w{font-size:10.5px;fill:var(--muted)}
.tl .era-name{font-family:var(--font-display);font-size:19px;font-weight:800;fill:var(--ink)}
.tl .era-date{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tl .spine-h{font-size:10.5px;font-weight:700;fill:var(--ink2)}
.tl .spine-h2{font-size:10.5px;fill:var(--muted)}
.tl .lane-h{font-size:14.5px;font-weight:700;fill:var(--ink)}
.tl .lane-v{font-size:11px;font-weight:700;fill:var(--ink2)}
.tl .lane-s{font-size:13px;font-weight:700;fill:var(--ink)}
.tl .f-red{fill:var(--red)}
.tl .s-red{stop-color:var(--red)}
.tl .f-blue{fill:var(--blue)}
.tl .s-blue{stop-color:var(--blue)}
.tl .f-amber{fill:var(--amber)}
.tl .s-amber{stop-color:var(--amber)}
.tl .f-violet{fill:var(--violet)}
.tl .s-violet{stop-color:var(--violet)}
.tl .f-green{fill:var(--green)}
.tl .s-green{stop-color:var(--green)}
.tl .f-teal{fill:var(--teal)}
.tl .s-teal{stop-color:var(--teal)}
.tl .f-gray{fill:var(--gray)}
.tl .s-gray{stop-color:var(--gray)}
.tl .future{opacity:0.4}
.tl .approx{opacity:0.45}
.tl .bar-lead{fill:url(#tl-hatch)}
.tl .bar-hatch{fill:url(#tl-hatch);stroke:var(--rule2);stroke-width:1}
.tl .hatch-bg{fill:var(--spine-a)}
.tl .hatch-line{stroke:var(--rule2);stroke-width:1.5}
.tl .dot{stroke:var(--paper);stroke-width:2}
.tl .photo-ring{fill:var(--spine-b)}
.tl .label{font-size:13.5px}
.tl .name{fill:var(--ink)}
.tl .lead-name{fill:var(--muted)}
.tl .yrs{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tl .inside{font-size:12px;font-weight:700;fill:#fff;letter-spacing:0.04em}
.tl .inside.on-pale{fill:var(--ink)}
.tl .leader{stroke:var(--rule2);stroke-width:1;fill:none}
.tl .hit{fill:transparent}
.tl .foot{font-size:11px;fill:var(--muted)}
</style>
